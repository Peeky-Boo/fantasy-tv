<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy TV Alert</title>
<style>
  :root {
    --accent: #FFC107;
    --nfl: #888;
    --good: #1DB954;
    --bad: #E53935;
    --gold: #FFC107;
    --ink: #F4F6FA;
    --muted: #9AA4B2;
    --card: rgba(10, 14, 22, 0.93);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  .card {
    position: absolute; top: 1.2vw; left: 1.2vw; right: 1.2vw; bottom: 1.2vw;
    background: var(--card);
    border-radius: 2vw;
    border: 0.25vw solid var(--accent-a55);
    box-shadow: 0 0 3vw var(--glow-a45);
    overflow: hidden;
    display: flex; flex-direction: column;
    animation: slideIn 0.65s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .card.out { animation: slideOut 0.55s ease-in forwards; }
  .card, .board, .crown, .fly, .spark, .shine { will-change: transform; }
  @keyframes slideIn { from { transform: translateX(115%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideOut { to { transform: translateX(115%); opacity: 0; } }

  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 1.6vw; background: var(--accent); }
  .shine {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.16) 50%, transparent 65%);
    transform: translateX(-100%);
    animation: shine 1.4s 0.5s ease-out both;
  }
  @keyframes shine { to { transform: translateX(100%); } }

  /* ---------- play card ---------- */
  .top { display: flex; align-items: center; gap: 2.4vw; padding: 2.2vw 3vw 0 4.2vw; flex: 1; }
  .badge {
    flex: none; width: 10vw; height: 10vw; border-radius: 50%;
    display: grid; place-items: center; font-size: 5.6vw;
    background: radial-gradient(circle at 35% 30%, var(--accent-light), var(--accent));
    box-shadow: 0 0 2.4vw var(--accent-a70);
    animation: pop 0.6s 0.35s cubic-bezier(.3, 1.8, .5, 1) both;
  }
  @keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
  .main { flex: 1; min-width: 0; }
  .label {
    font-weight: 900; font-size: 5.4vw; letter-spacing: 0.05em; line-height: 1;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kind-td .label {
    background: linear-gradient(90deg, #fff, var(--gold), #fff);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gleam 1.6s linear 2;
  }
  @keyframes gleam { to { background-position: -200% 0; } }
  .who {
    display: inline-block; margin-top: 1vw; padding: 0.4vw 1.4vw; border-radius: 99px;
    font-size: 2.5vw; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--accent-a25);
    border: 0.2vw solid var(--accent); color: var(--ink);
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
  }
  .player { margin-top: 1.1vw; font-size: 3.1vw; font-weight: 600; display: flex; align-items: center; gap: 1.2vw; white-space: nowrap; }
  .player .name { overflow: hidden; text-overflow: ellipsis; }
  .chip { flex: none; font-size: 2vw; font-weight: 800; padding: 0.3vw 1vw; border-radius: 0.6vw; background: var(--nfl); color: #fff; }
  .delta {
    flex: none; text-align: right; font-weight: 900; font-size: 7vw; line-height: 1;
    color: var(--good); font-variant-numeric: tabular-nums;
  }
  .delta small { display: block; font-size: 2vw; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; }
  .bad .delta { color: var(--bad); }

  /* ---------- score strip ---------- */
  .strip {
    display: flex; align-items: center; gap: 1.6vw; margin: 1.4vw 0 0;
    padding: 1.3vw 3vw 1.3vw 4.2vw; background: rgba(255,255,255,0.06);
    font-size: 2.7vw; font-weight: 700;
  }
  .strip .side { flex: 1; display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
  .strip .side.b { flex-direction: row-reverse; text-align: right; }
  .strip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .strip .lead .nm { color: var(--ink); }
  .strip .pts { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 3.2vw; color: var(--muted); }
  .strip .lead .pts { color: var(--ink); }
  .dot { flex: none; width: 1.6vw; height: 1.6vw; border-radius: 50%; }
  .vs { color: var(--muted); font-size: 2vw; }
  .meter { position: absolute; left: 1.6vw; right: 0; bottom: 0; height: 0.6vw; display: flex; }
  .meter i { display: block; height: 100%; transition: width 1s ease; }

  /* ---------- lead change ---------- */
  .lead-card .top { padding-top: 2.6vw; }
  .lead-card .label { font-size: 4.6vw; white-space: normal; line-height: 1.1;
                      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* ---------- scoreboard ---------- */
  .board { position: absolute; top: 1.2vw; left: 1.2vw; right: 1.2vw; bottom: 1.2vw; background: var(--card); border-radius: 2vw; overflow: hidden;
           border: 0.25vw solid rgba(255,193,7,0.5); animation: slideIn 0.6s cubic-bezier(.2,1.3,.4,1) both; }
  .board.out { animation: slideOut 0.5s ease-in forwards; }
  .bhead { display: flex; align-items: center; gap: 1.6vw; padding: 2vw 3vw; font-weight: 900;
           font-size: 3.2vw; letter-spacing: 0.06em; text-transform: uppercase;
           background: linear-gradient(90deg, rgba(255,193,7,0.25), transparent); }
  .bhead .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .live { display: flex; align-items: center; gap: 0.8vw; font-size: 2vw; color: #ff5252; letter-spacing: 0.15em; }
  .live i { width: 1.4vw; height: 1.4vw; border-radius: 50%; background: #ff5252; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .row { display: grid; grid-template-columns: 1.6vw 1fr auto 3vw auto 1fr 1.6vw; align-items: center; gap: 1.2vw;
         padding: 0 3vw; height: 7.6vw; font-size: 2.7vw; font-weight: 700;
         border-top: 0.15vw solid rgba(255,255,255,0.07);
         animation: rowIn 0.45s ease-out both; }
  .row.mine { background: rgba(255,193,7,0.12); box-shadow: inset 0.8vw 0 0 var(--gold); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(1.5vw); } }
  .row .n { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
  .row .n.b { text-align: right; }
  .row .p { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 3vw; color: var(--muted); }
  .row .w { color: var(--ink); }
  .row .x { text-align: center; color: var(--muted); font-size: 2vw; }

  /* ---------- scoreboard flair ---------- */
  .bhead { position: relative; overflow: hidden; }
  .bhead:after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 35%; will-change: transform;
                 background: linear-gradient(105deg, transparent, rgba(255,255,255,0.2), transparent);
                 transform: translateX(-120%); animation: sweep 12s ease-in-out infinite; }
  @keyframes sweep { 0%, 85% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .row { position: relative; }
  .share { position: absolute; left: 3vw; right: 3vw; bottom: 0.6vw; height: 0.45vw; display: flex;
           border-radius: 1vw; overflow: hidden; opacity: 0.8; }
  .share b { display: block; height: 100%; transition: width 1.2s ease; }
  /* win chance: the bar sits between the two percentages */
  /* names and scores on the top half of the row, the win-chance bar on its own line below */
  .row.odds { align-items: start; padding-top: 0.9vw; }
  .row.odds > .dot { margin-top: 0.75vw; }
  .row.odds .share { left: 9vw; right: 9vw; bottom: 1.25vw; height: 0.6vw; opacity: 0.95; }
  .wp { position: absolute; bottom: 0.45vw; font-style: normal; font-size: 1.8vw; line-height: 1; font-weight: 800;
        font-variant-numeric: tabular-nums; color: var(--muted); }
  .wp.a { left: 3vw; } .wp.b { right: 3vw; }
  .wp.fav { color: var(--ink); }
  .row .p { position: relative; }
  .row .p.w { text-shadow: 0 0 1.6vw rgba(255,193,7,0.6); }
  .crown { display: inline-block; margin: 0 0.5vw; font-size: 2.3vw; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-0.4vw) rotate(-8deg); } }
  .bump { animation: bump 1.3s ease-out; }
  @keyframes bump { 0% { color: #FFC107; transform: scale(1.4); } 60% { color: #FFC107; } 100% { transform: none; } }
  .fly { position: absolute; left: 50%; top: -0.5vw; transform: translateX(-50%); font-size: 2vw; font-style: normal;
         color: #1DB954; text-shadow: 0 0 1vw rgba(29,185,84,0.8); pointer-events: none;
         animation: fly 1.8s ease-out forwards; white-space: nowrap; }
  .fly.neg { color: #ff6b6b; text-shadow: none; }
  @keyframes fly { 0% { opacity: 0; transform: translate(-50%, 1vw); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -4vw); } }
  .flip { animation: flip 1.6s ease-out; }
  @keyframes flip { 0%, 35% { background-color: rgba(255,193,7,0.4); } 100% { background-color: transparent; } }


  /* ================= THEME: STADIUM (team colour fills the card) ================= */
  .theme-stadium .card { background: linear-gradient(115deg, var(--accent) 0%, var(--accent-dark) 100%); border: 0; }
  .theme-stadium .card:before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.07) 0 1vw, transparent 1vw 2.6vw); }
  .theme-stadium .bar { display: none; }
  .theme-stadium .top { padding-left: 3vw; position: relative; }
  .theme-stadium .label { font-style: italic; font-size: 6.6vw; text-shadow: 0 0.4vw 0 rgba(0,0,0,0.3); }
  .theme-stadium .kind-td .label { background: linear-gradient(90deg, #fff, #FFE082, #fff); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .theme-stadium .badge { background: #fff; box-shadow: 0 0.6vw 0 rgba(0,0,0,0.25); }
  .theme-stadium .who { background: rgba(0,0,0,0.35); border: 0; }
  .theme-stadium .chip { box-shadow: 0 0 0 0.25vw rgba(255,255,255,0.7); }
  .theme-stadium .delta, .theme-stadium .bad .delta { color: #fff; text-shadow: 0 0.4vw 0 rgba(0,0,0,0.3); }
  .theme-stadium .delta small { color: rgba(255,255,255,0.75); }
  .theme-stadium .strip { background: rgba(0,0,0,0.5); position: relative; padding-left: 3vw; }
  .theme-stadium .strip .nm, .theme-stadium .strip .pts { color: rgba(255,255,255,0.65); }
  .theme-stadium .strip .lead .nm, .theme-stadium .strip .lead .pts { color: #fff; }
  .theme-stadium .meter { left: 0; }

  /* ================= THEME: LOWER THIRD (slim strip along the bottom) ================= */
  .theme-strip .card { flex-direction: row; align-items: stretch; border-radius: 1.2vw;
                       top: 0.8vw; bottom: 0.8vw; left: 0.8vw; right: 0.8vw; border-width: 0.15vw; }
  .theme-strip .bar { width: 0.9vw; }
  .theme-strip .top { padding: 0 2vw 0 2.6vw; gap: 1.6vw; }
  .theme-strip .badge { width: 6.4vw; height: 6.4vw; font-size: 3.6vw; }
  .theme-strip .label { font-size: 3.4vw; display: inline-block; vertical-align: middle; max-width: 100%; }
  .theme-strip .who { display: inline-block; vertical-align: middle; margin: 0 0 0 1.2vw; font-size: 1.4vw; padding: 0.25vw 0.9vw; max-width: 40%; }
  .theme-strip .player { font-size: 1.9vw; margin-top: 0.6vw; gap: 0.8vw; }
  .theme-strip .chip { font-size: 1.2vw; padding: 0.2vw 0.6vw; }
  .theme-strip .delta { font-size: 4.4vw; }
  .theme-strip .delta small { font-size: 1.1vw; }
  .theme-strip .strip { flex-direction: column; justify-content: center; align-items: stretch; gap: 0.5vw;
                        width: 24vw; flex: none; margin: 0; padding: 0 2vw; font-size: 1.6vw; }
  .theme-strip .strip .side.b { flex-direction: row; text-align: left; }
  .theme-strip .strip .nm { flex: 1; }
  .theme-strip .strip .pts { font-size: 1.9vw; }
  .theme-strip .strip .dot { width: 1vw; height: 1vw; }
  .theme-strip .vs { display: none; }
  .theme-strip .meter { display: none; }
  .theme-strip .lead-card .top { padding-top: 0; }
  .theme-strip .lead-card .label { font-size: 3.2vw; -webkit-line-clamp: 1; }
  .theme-strip .spark { width: 0.7vw; height: 1.1vw; }

  /* player headshot in the badge, with the play emoji as a sticker */
  .badge.photo { background: #1d2430; position: relative; box-shadow: 0 0 0 0.45vw var(--accent), 0 0 2.4vw var(--accent-a70); }
  .badge.photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center top; display: block; }
  .badge .em { line-height: 1; }
  .badge.photo .em { position: absolute; right: -1.2vw; bottom: -1vw; width: 5vw; height: 5vw; border-radius: 50%;
                     display: grid; place-items: center; font-size: 3vw; background: var(--accent);
                     box-shadow: 0 0 0 0.35vw rgba(10,14,22,0.9); }
  .theme-stadium .badge.photo { box-shadow: 0 0 0 0.45vw #fff, 0 0.6vw 0 0.45vw rgba(0,0,0,0.25); }
  .theme-stadium .badge.photo .em { background: #fff; }
  .theme-strip .badge.photo .em { width: 3.2vw; height: 3.2vw; font-size: 1.9vw; right: -0.8vw; bottom: -0.6vw; }
  .detail { flex: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; color: var(--gold); font-weight: 700; }
  .theme-stadium .detail { color: #fff; opacity: 0.9; }

  /* long titles (e.g. SACK / TAKEAWAY) shrink to fit */
  .long .label { font-size: 4.4vw; }
  .theme-stadium .long .label { font-size: 5.2vw; }
  .theme-strip .long .label { font-size: 2.9vw; }
  .theme-stadium .card { background: linear-gradient(115deg, var(--fill-a) 0%, var(--fill-b) 100%); }

  /* ---------- confetti (touchdowns) ---------- */
  .spark { position: absolute; width: 1.1vw; height: 1.8vw; border-radius: 0.3vw; top: 40%; left: 12%;
           animation: burst 1.3s cubic-bezier(.1,.7,.3,1) forwards; opacity: 0; }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var root = document.getElementById('root');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  function rgb(hex) { hex = String(hex || '#888').replace('#', '').slice(-6);
    return [0, 2, 4].map(function (i) { return parseInt(hex.substr(i, 2), 16) || 0; }); }
  function rgba(hex, a) { return 'rgba(' + rgb(hex).join(',') + ',' + a + ')'; }
  function mixWhite(hex, k) { return 'rgb(' + rgb(hex).map(function (v) { return Math.round(v + (255 - v) * k); }).join(',') + ')'; }
  function mixBlack(hex, k) { return 'rgb(' + rgb(hex).map(function (v) { return Math.round(v * (1 - k)); }).join(',') + ')'; }
  document.body.className = 'theme-' + (qs.get('theme') || 'broadcast');
  function pts(n) { return (Math.round((n || 0) * 10) / 10).toFixed(1); }

  function strip(score) {
    if (!score || !score.a) return '';
    var a = score.a, b = score.b;
    if (!b) return '<div class="strip"><div class="side lead"><i class="dot" style="background:' + a.colour + '"></i><span class="nm">' + esc(a.name) + '</span><span class="pts">' + pts(a.pts) + '</span></div></div>';
    var la = a.pts > b.pts, lb = b.pts > a.pts;
    var total = Math.max(0.1, a.pts + b.pts), wa = (a.pts / total * 100).toFixed(1);
    return '<div class="strip">' +
      '<div class="side a' + (la ? ' lead' : '') + '"><i class="dot" style="background:' + a.colour + '"></i><span class="nm">' + esc(a.name) + '</span><span class="pts">' + pts(a.pts) + '</span></div>' +
      '<span class="vs">v</span>' +
      '<div class="side b' + (lb ? ' lead' : '') + '"><i class="dot" style="background:' + b.colour + '"></i><span class="nm">' + esc(b.name) + '</span><span class="pts">' + pts(b.pts) + '</span></div>' +
      '</div><div class="meter"><i style="width:' + wa + '%;background:' + a.colour + '"></i><i style="flex:1;background:' + b.colour + '"></i></div>';
  }

  function badge(a) {
    if (!a.photo) return '<div class="badge"><span class="em">' + esc(a.emoji) + '</span></div>';
    return '<div class="badge photo"><img src="' + esc(a.photo) + '" alt="" ' +
      'onerror="var b=this.parentNode;b.classList.remove(\'photo\');this.remove()"><span class="em">' + esc(a.emoji) + '</span></div>';
  }

  function countUp(el, target) {
    var start = performance.now(), dur = 900;
    (function step(t) {
      var k = Math.min(1, (t - start) / dur), v = target * (1 - Math.pow(1 - k, 3));
      el.textContent = (v >= 0 ? '+' : '') + v.toFixed(1);
      if (k < 1) requestAnimationFrame(step);
    })(start);
  }

  function confetti(card, colours) {
    for (var i = 0; i < 26; i++) {
      var s = document.createElement('i');
      s.className = 'spark';
      var ang = Math.random() * Math.PI * 2, dist = 18 + Math.random() * 40;
      s.style.setProperty('--dx', (Math.cos(ang) * dist) + 'vw');
      s.style.setProperty('--dy', (Math.sin(ang) * dist * 0.6) + 'vw');
      s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      s.style.background = colours[i % colours.length];
      s.style.animationDelay = (0.35 + Math.random() * 0.25) + 's';
      card.appendChild(s);
    }
  }

  function boardHtml(title, rows, live, preview) {
    var h = '<div class="board" id="card"><div class="bhead"><span class="t">' + (live ? '🏆 ' : '🏈 ') + esc(title) + '</span>' +
            (live ? '<span class="live"><i></i>LIVE</span>' : '') + '</div>';
    var top = 0;
    if (!preview) rows.forEach(function (r) { top = Math.max(top, r.a.pts || 0, (r.b || {}).pts || 0); });
    var crown = function (p) { return top > 0 && p === top ? '<span class="crown">👑</span>' : ''; };
    rows.forEach(function (r, i) {
      var a = r.a, b = r.b || {name: 'Bye', pts: 0, colour: '#555'};
      var wa = !preview && a.pts > b.pts, wb = !preview && b.pts > a.pts;
      var share = Math.max(0.1, a.pts + b.pts), sa = (a.pts / share * 100).toFixed(1);
      var odds = !preview && r.b && typeof r.wp === 'number';
      if (odds) sa = r.wp;
      h += '<div class="row' + (r.mine ? ' mine' : '') + (odds ? ' odds' : '') + '" data-k="' + esc(a.name + '|' + b.name) + '" data-lead="' + (wa ? 'a' : wb ? 'b' : '') +
        '" style="animation-delay:' + (0.25 + i * 0.07) + 's">' +
        '<i class="dot" style="background:' + a.colour + '"></i>' +
        '<span class="n' + (wa ? ' w' : '') + '">' + esc(a.name) + crown(a.pts) + '</span>' +
        '<span class="p' + (wa ? ' w' : '') + '" data-v="' + a.pts + '">' + (preview ? '' : pts(a.pts)) + '</span>' +
        '<span class="x">v</span>' +
        '<span class="p' + (wb ? ' w' : '') + '" data-v="' + b.pts + '">' + (preview ? '' : pts(b.pts)) + '</span>' +
        '<span class="n b' + (wb ? ' w' : '') + '">' + crown(b.pts) + esc(b.name) + '</span>' +
        '<i class="dot" style="background:' + b.colour + '"></i>' +
        (preview ? '' : '<i class="share"><b style="width:' + sa + '%;background:' + a.colour + '"></b><b style="flex:1;background:' + b.colour + '"></b></i>') +
        (odds ? '<i class="wp a' + (r.wp >= 50 ? ' fav' : '') + '">' + r.wp + '%</i><i class="wp b' + (r.wp <= 50 ? ' fav' : '') + '">' + (100 - r.wp) + '%</i>' : '') +
        '</div>';
    });
    return h + '</div>';
  }

  // tick a score from its old value to the new one, with a floating "+6.6"
  function bumpScore(el, from, to) {
    var start = performance.now(), dur = 1100, d = to - from;
    (function step(t) {
      var k = Math.min(1, (t - start) / dur);
      el.firstChild.nodeValue = pts(from + d * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    })(start);
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    var f = document.createElement('em');
    f.className = 'fly' + (d < 0 ? ' neg' : '');
    f.textContent = (d > 0 ? '+' : '') + (Math.round(d * 10) / 10).toFixed(1);
    el.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1900);
  }

  function render(a) {
    if (!a || !a.kind) { root.innerHTML = ''; return; }
    var css = document.documentElement.style;
    var acc = a.colour || '#FFC107';
    var glow = a.good === false ? '#E53935' : (a.kind === 'td' ? '#FFC107' : acc);
    css.setProperty('--accent', acc);
    css.setProperty('--accent-a25', rgba(acc, 0.25));
    css.setProperty('--accent-a55', rgba(acc, 0.55));
    css.setProperty('--accent-a70', rgba(acc, 0.7));
    css.setProperty('--accent-light', mixWhite(acc, 0.3));
    css.setProperty('--accent-dark', mixBlack(acc, 0.45));
    var c = rgb(acc), lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
    css.setProperty('--fill-a', lum > 0.6 ? mixBlack(acc, 0.4) : acc);   // pale colours get darkened
    css.setProperty('--fill-b', mixBlack(acc, lum > 0.6 ? 0.65 : 0.45));
    css.setProperty('--glow-a45', rgba(glow, 0.45));
    if (a.nflColour) css.setProperty('--nfl', a.nflColour);

    if (a.kind === 'scores' || a.kind === 'matchups') {
      root.innerHTML = boardHtml(a.label, a.lines || [], a.kind === 'scores', a.kind === 'matchups');
    } else if (a.kind === 'lead' || a.kind === 'lost') {
      root.innerHTML = '<div class="card lead-card kind-' + a.kind + (a.good === false ? ' bad' : '') + '" id="card"><i class="bar"></i><i class="shine"></i>' +
        '<div class="top">' + badge({emoji: a.emoji}) + '<div class="main"><div class="label">' + esc(a.label) + '</div></div></div>' +
        strip(a.score) + '</div>';
    } else {
      var pos = [a.pos, a.nfl].filter(Boolean).join(' ');
      root.innerHTML = '<div class="card kind-' + a.kind + (a.good === false ? ' bad' : '') + ((a.label || '').length > 12 ? ' long' : '') + '" id="card"><i class="bar"></i><i class="shine"></i>' +
        '<div class="top">' + badge(a) +
        '<div class="main"><div class="label">' + esc(a.label) + '</div>' +
        (a.who ? '<div class="who">' + esc(a.who) + '</div>' : '') +
        (a.player ? '<div class="player"><span class="name">' + esc(a.player) + '</span>' + (pos ? '<span class="chip">' + esc(pos) + '</span>' : '') +
          (a.detail ? '<span class="detail">' + esc(a.detail) + '</span>' : '') + '</div>' : '') +
        '</div>' +
        (a.delta != null ? '<div class="delta"><span id="d">+0.0</span><small>PTS</small></div>' : '') +
        '</div>' + strip(a.score) + '</div>';
      if (a.delta != null) countUp(document.getElementById('d'), a.delta);
      if (a.kind === 'td') confetti(document.getElementById('card'), ['#FFC107', '#fff', a.colour || '#29B6F6', a.nflColour || '#1DB954']);
    }
    var dur = (a.duration || 8) * 1000;
    if (!qs.get('stay')) setTimeout(function () {
      var c = document.getElementById('card'); if (c) c.className += ' out';
    }, Math.max(1500, dur - 700));
  }

  var drawn = false;
  function drawBoard(b) {
    if (!b || !b.rows || !b.rows.length) return;
    var html = boardHtml(b.league + '  WEEK ' + b.week, b.rows, true, false);
    if (!drawn || !root.firstChild) { root.innerHTML = html; drawn = true; return; }
    // remember what was on screen so changes can be animated
    var old = {};
    root.querySelectorAll('.row').forEach(function (r) {
      var p = r.querySelectorAll('.p');
      old[r.dataset.k] = { a: parseFloat(p[0].dataset.v), b: parseFloat(p[1].dataset.v), lead: r.dataset.lead,
                           sa: (r.querySelector('.share b') || {}).style };
    });
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    tmp.querySelectorAll('.row').forEach(function (r) { r.style.animation = 'none'; });
    var oldShares = {};
    root.querySelectorAll('.row').forEach(function (r) { var s = r.querySelector('.share b'); if (s) oldShares[r.dataset.k] = s.style.width; });
    root.firstChild.replaceWith(tmp.firstChild);
    root.firstChild.style.animation = 'none';
    root.querySelectorAll('.row').forEach(function (r) {
      var o = old[r.dataset.k]; if (!o) return;
      var p = r.querySelectorAll('.p'), vals = [parseFloat(p[0].dataset.v), parseFloat(p[1].dataset.v)];
      if (Math.abs(vals[0] - o.a) >= 0.05) bumpScore(p[0], o.a, vals[0]);
      if (Math.abs(vals[1] - o.b) >= 0.05) bumpScore(p[1], o.b, vals[1]);
      if (o.lead && r.dataset.lead && o.lead !== r.dataset.lead) r.classList.add('flip');
      var s = r.querySelector('.share b'), w = s && s.style.width;
      if (s && oldShares[r.dataset.k]) { s.style.transition = 'none'; s.style.width = oldShares[r.dataset.k]; void s.offsetWidth; s.style.transition = ''; s.style.width = w; }
    });
  }
  // the Fire Stick app (tv.html) hands alerts and scores to this page directly
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.type === 'alert') render(m.alert);
    else if (m.type === 'board') drawBoard(m.board);
  });

  if (qs.get('board') && !qs.get('embed')) {
    // live banner: refreshes itself from the laptop every few seconds
    var tick = function () {
      fetch('/board.json').then(function (r) { return r.json(); }).then(drawBoard).catch(function () {});
    };
    tick(); setInterval(tick, 5000);
  } else if (qs.get('data')) {
    render(JSON.parse(decodeURIComponent(qs.get('data'))));
  } else if (qs.get('id')) {
    fetch('/alert/' + qs.get('id') + '.json').then(function (r) { return r.json(); }).then(render)
      .catch(function () { root.innerHTML = ''; });
  }
  window.renderAlert = render;
})();
</script>
</body>
</html>
